<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多模态鲁棒性评估平台 - Vue3 Demo</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: #f8fafc;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    [v-cloak] { display: none; }

    .fade-enter-active, .fade-leave-active { transition: opacity 0.18s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

    .slide-enter-active { transition: all 0.22s ease-out; }
    .slide-leave-active { transition: all 0.18s ease-in; }
    .slide-enter-from, .slide-leave-to { transform: translateY(6px); opacity: 0; }

    /* 动画示例：走马灯进度条 */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .shimmer-bar::after{
      content:"";
      position:absolute;
      inset:0;
      width:40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.2s linear infinite;
    }

    /* 动画示例：脉冲点 */
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .pulse-dot { animation: pulseDot 0.9s ease-in-out infinite; }
    
    /* 新增：步骤进度条动画 */
    .progress-bar {
      background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
      background-size: 200% 100%;
      animation: gradient-shift 2s ease infinite;
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .step-active {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .model-type-cell {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 100px;
    }
  </style>
</head>

<body class="text-gray-900 antialiased">
<div id="app" v-cloak class="flex min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">

  <!-- 左侧导航栏 -->
  <aside class="w-72 border-r border-gray-200 flex flex-col fixed h-full bg-white z-30 shadow-sm">
    <!-- Logo -->
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white text-lg font-bold shadow-lg">
          AI
        </div>
        <div>
          <div class="font-bold text-xl tracking-tight text-gray-900">QualityEval</div>
          <p class="text-xs text-gray-500">多模态鲁棒性评估平台</p>
        </div>
      </div>
    </div>

    <!-- 菜单 -->
    <nav class="flex-1 overflow-y-auto p-4 no-scrollbar">
      <div class="text-xs font-semibold text-gray-400 mb-3 px-3 uppercase tracking-wider">平台总览</div>
      <sidebar-item icon="layout-dashboard" label="控制台" view="dashboard" :active="currentView==='dashboard'" @click="changeView('dashboard')"></sidebar-item>

      <div class="mt-6 text-xs font-semibold text-gray-400 mb-3 px-3 uppercase tracking-wider">核心模块</div>
      <sidebar-item icon="shield-alert" label="鲁棒性评估平台" view="robustness" :active="currentView==='robustness'" @click="changeView('robustness')"></sidebar-item>
      <sidebar-item icon="database" label="数据集管理" view="datasets" :active="currentView==='datasets'" @click="changeView('datasets')" badge="规划中"></sidebar-item>
      <sidebar-item icon="cpu" label="模型管理" view="models" :active="currentView==='models'" @click="changeView('models')" badge="规划中"></sidebar-item>
      <sidebar-item icon="flask-conical" label="算法库" view="attacks" :active="currentView==='attacks'" @click="changeView('attacks')" badge="规划中"></sidebar-item>

      <div class="mt-6 text-xs font-semibold text-gray-400 mb-3 px-3 uppercase tracking-wider">系统管理</div>
      <sidebar-item icon="server" label="算力资源" view="resources" :active="currentView==='resources'" @click="changeView('resources')"></sidebar-item>
      <sidebar-item icon="settings" label="系统设置" view="settings" :active="currentView==='settings'" @click="changeView('settings')"></sidebar-item>
    </nav>

    <!-- 用户 -->
    <div class="p-4 border-t border-gray-100">
      <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-sm font-bold text-white shadow">
          ADM
        </div>
        <div class="flex-1">
          <div class="font-medium text-sm">Admin</div>
          <div class="text-xs text-gray-500">平台管理员</div>
        </div>
        <i data-lucide="log-out" class="w-4 h-4 text-gray-400"></i>
      </div>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="flex-1 ml-72">
    <!-- 顶部栏 -->
    <header class="h-16 border-b border-gray-200 flex items-center justify-between px-8 bg-white/90 backdrop-blur-md sticky top-0 z-20 shadow-sm">
      <div class="flex items-center gap-4">
        <nav class="flex items-center gap-2 text-sm">
          <span class="text-gray-500">首页</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
          <span class="text-gray-900 font-medium">{{ viewTitle }}</span>
        </nav>
      </div>

      <div class="flex items-center gap-6">
        <!-- 系统状态 -->
        <div class="flex items-center gap-2 px-4 py-2 bg-emerald-50 rounded-full border border-emerald-200">
          <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-xs font-medium text-emerald-700">Scheduler Online</span>
        </div>

        <!-- 通知 -->
        <div class="relative">
          <i data-lucide="bell" class="w-5 h-5 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors"></i>
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-[10px] text-white flex items-center justify-center font-bold">
            2
          </span>
        </div>

        <i data-lucide="search" class="w-5 h-5 text-gray-400 hover:text-gray-600 cursor-pointer transition-colors"></i>
      </div>
    </header>

    <div class="p-8">
      <transition name="fade" mode="out-in">
        <dashboard-view v-if="currentView==='dashboard'" :key="currentView"></dashboard-view>
        <robustness-view v-else-if="currentView==='robustness'" :key="currentView"></robustness-view>
        <placeholder-view v-else :key="currentView" :title="viewTitle"></placeholder-view>
      </transition>
    </div>
  </main>
</div>

<script>
const { createApp, ref, computed, onMounted, watch, reactive, nextTick } = Vue;

/* ---------------------------
   Mock API（替换为真实后端）
---------------------------- */
const mockApi = (() => {
  const datasets = [
    { id: "ds-img-cifar10", name: "CIFAR-10", modality: "image", task: "classification", splits: ["train","test"], stats: { samples: 10000, classes: 10, input: "32×32×3" } },
    { id: "ds-img-imagenet-mini", name: "ImageNet-Mini", modality: "image", task: "classification", splits: ["val"], stats: { samples: 5000, classes: 100, input: "224×224×3" } },
    { id: "ds-txt-agnews", name: "AG News", modality: "text", task: "classification", splits: ["test"], stats: { samples: 7600, classes: 4, input: "tokenized" } },
    { id: "ds-aud-esc50-mini", name: "ESC-50-Mini", modality: "audio", task: "classification", splits: ["test"], stats: { samples: 2000, classes: 50, input: "1×T@16kHz" } },
  ];

  const models = [
    { id: "m-resnet18-cifar10-v1", name: "ResNet-18 (CIFAR-10)", modality: "image", task: "classification", datasetId: "ds-img-cifar10", version: "v1.0.2", cleanMetric: 0.915, inputSpec: "[0,1] RGB", deviceHint: "GPU" },
    { id: "m-resnet50-imnetmini-v2", name: "ResNet-50 (ImageNet-Mini)", modality: "image", task: "classification", datasetId: "ds-img-imagenet-mini", version: "v2.1.0", cleanMetric: 0.763, inputSpec: "mean/std norm", deviceHint: "GPU" },
    { id: "m-bert-agnews-v3", name: "BERT-Base (AG News)", modality: "text", task: "classification", datasetId: "ds-txt-agnews", version: "v3.0.0", cleanMetric: 0.934, inputSpec: "tokenizer=bert-base", deviceHint: "GPU/CPU" },
    { id: "m-crnn-esc50-v1", name: "CRNN (ESC-50-Mini)", modality: "audio", task: "classification", datasetId: "ds-aud-esc50-mini", version: "v1.3.1", cleanMetric: 0.801, inputSpec: "log-mel", deviceHint: "GPU" },
  ];

  const attacks = [
    { id: "a-fgsm", name: "FGSM", modality: "image", task: "classification", modes: ["whitebox"], desc: "单步梯度符号攻击（L∞）" },
    { id: "a-pgd", name: "PGD", modality: "image", task: "classification", modes: ["whitebox"], desc: "多步投影梯度下降（L∞/L2）" },
    { id: "a-cw", name: "CW", modality: "image", task: "classification", modes: ["whitebox"], desc: "优化式攻击（L2）" },
    { id: "a-square", name: "Square Attack", modality: "image", task: "classification", modes: ["blackbox"], desc: "查询式黑盒攻击（L∞）" },
    { id: "a-textfooler", name: "TextFooler", modality: "text", task: "classification", modes: ["blackbox","whitebox"], desc: "词级替换，语义保持扰动" },
    { id: "a-bertattack", name: "BERT-Attack", modality: "text", task: "classification", modes: ["blackbox","whitebox"], desc: "基于 MLM 的替换攻击" },
    { id: "a-audio-pgd", name: "Audio-PGD", modality: "audio", task: "classification", modes: ["whitebox"], desc: "音频域/频谱域 PGD" },
  ];

  const schemas = {
    "a-fgsm": {
      title: "FGSM 参数",
      fields: [
        { key: "epsilon", label: "扰动预算 ε", type: "number", min: 0.0, max: 0.3, step: 0.001, default: 0.031, unit: "（归一化空间）", help: "典型值：8/255≈0.031" },
        { key: "norm", label: "范数约束", type: "enum", options: ["linf"], default: "linf", help: "FGSM 常用 L∞" },
        { key: "clamp", label: "输入裁剪", type: "enum", options: ["[0,1]", "[-1,1]", "none"], default: "[0,1]" },
        { key: "targeted", label: "目标攻击", type: "boolean", default: false },
        { key: "target_class", label: "目标类别", type: "number", min: 0, max: 999, step: 1, default: 0, visible_if: { key: "targeted", equals: true }, help: "仅目标攻击时启用" },
        { key: "seed", label: "随机种子", type: "number", min: 0, max: 999999, step: 1, default: 42 },
      ]
    },
    "a-pgd": {
      title: "PGD 参数",
      fields: [
        { key: "epsilon", label: "扰动预算 ε", type: "number", min: 0.0, max: 0.3, step: 0.001, default: 0.031, unit: "（归一化空间）" },
        { key: "norm", label: "范数约束", type: "enum", options: ["linf","l2"], default: "linf" },
        { key: "steps", label: "迭代步数", type: "number", min: 1, max: 200, step: 1, default: 20 },
        { key: "alpha", label: "步长 α", type: "number", min: 0.0, max: 0.1, step: 0.0005, default: 0.007, help: "常用：α≈ε/steps 或 2/255" },
        { key: "restarts", label: "随机重启", type: "number", min: 1, max: 50, step: 1, default: 1 },
        { key: "early_stop", label: "成功早停", type: "boolean", default: true },
        { key: "clamp", label: "输入裁剪", type: "enum", options: ["[0,1]", "[-1,1]", "none"], default: "[0,1]" },
        { key: "seed", label: "随机种子", type: "number", min: 0, max: 999999, step: 1, default: 42 },
      ]
    },
    "a-square": {
      title: "Square Attack 参数",
      fields: [
        { key: "epsilon", label: "扰动预算 ε", type: "number", min: 0.0, max: 0.3, step: 0.001, default: 0.031 },
        { key: "queries", label: "查询预算", type: "number", min: 100, max: 50000, step: 50, default: 5000 },
        { key: "p_init", label: "初始扰动比例 p_init", type: "number", min: 0.001, max: 0.5, step: 0.001, default: 0.1 },
        { key: "seed", label: "随机种子", type: "number", min: 0, max: 999999, step: 1, default: 42 },
      ]
    },
    "a-textfooler": {
      title: "TextFooler 参数",
      fields: [
        { key: "max_changes", label: "最大替换比例", type: "number", min: 0.01, max: 0.5, step: 0.01, default: 0.15, unit: "（比例）" },
        { key: "similarity", label: "语义相似度阈值", type: "number", min: 0.5, max: 0.99, step: 0.01, default: 0.85 },
        { key: "topk", label: "候选词 Top-K", type: "number", min: 5, max: 200, step: 5, default: 50 },
        { key: "seed", label: "随机种子", type: "number", min: 0, max: 999999, step: 1, default: 42 },
      ]
    }
  };

  // 黄金数据集指标
  const goldenDatasets = {
    "ds-img-cifar10": {
      name: "CIFAR-10 黄金数据集",
      cleanAcc: 0.945,
      robustAcc: 0.712,
      asr: 0.288,
      avgEps: 0.031,
      avgQueries: 3200,
      totalSeconds: 156
    },
    "ds-img-imagenet-mini": {
      name: "ImageNet-Mini 黄金数据集",
      cleanAcc: 0.812,
      robustAcc: 0.543,
      asr: 0.457,
      avgEps: 0.025,
      avgQueries: 4500,
      totalSeconds: 245
    },
    "ds-txt-agnews": {
      name: "AG News 黄金数据集",
      cleanAcc: 0.961,
      robustAcc: 0.683,
      asr: 0.317,
      avgEps: 0.15,
      avgQueries: 0,
      totalSeconds: 189
    },
    "ds-aud-esc50-mini": {
      name: "ESC-50-Mini 黄金数据集",
      cleanAcc: 0.852,
      robustAcc: 0.624,
      asr: 0.376,
      avgEps: 0.028,
      avgQueries: 0,
      totalSeconds: 203
    }
  };

  function getDatasets(modality) {
    return datasets.filter(d => !modality || d.modality === modality);
  }
  function getModelsByDataset(datasetId) {
    return models.filter(m => m.datasetId === datasetId);
  }
  function getAttacks(modality, task, threat) {
    return attacks.filter(a => a.modality === modality && a.task === task && (!threat || a.modes.includes(threat)));
  }
  function getSchema(attackId) {
    return schemas[attackId] || { title: "参数", fields: [] };
  }
  function getGoldenDataset(datasetId) {
    return goldenDatasets[datasetId] || null;
  }

  return { getDatasets, getModelsByDataset, getAttacks, getSchema, getGoldenDataset };
})();

/* ---------------------------
   UI Components
---------------------------- */
const SidebarItem = {
  props: ["icon","label","active","badge","view"],
  emits: ["click"],
  template: `
    <div
      @click="$emit('click')"
      :class="[
        'group flex items-center justify-between px-3 py-2.5 mb-1 rounded-lg cursor-pointer transition-all',
        active ? 'bg-gradient-to-r from-indigo-50 to-purple-50 text-indigo-700 font-medium shadow-sm' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'
      ]">
      <div class="flex items-center gap-3">
        <i :data-lucide="icon" :class="[
          'w-[18px] h-[18px]',
          active ? 'text-indigo-600' : 'text-gray-400 group-hover:text-gray-600'
        ]"></i>
        <span class="text-sm">{{ label }}</span>
      </div>
      <span v-if="badge" class="text-[10px] px-2 py-0.5 bg-gray-100 text-gray-600 rounded-full font-medium border border-gray-200">
        {{ badge }}
      </span>
    </div>
  `
};

const PlaceholderView = {
  props: ["title"],
  setup() {
    onMounted(() => lucide.createIcons());
    return {};
  },
  template: `
    <div class="max-w-7xl mx-auto space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ title }}</h1>
          <p class="text-gray-600">该模块为演示占位，后续可按同样风格扩展。</p>
        </div>
      </div>
      <div class="p-12 border border-gray-200 rounded-xl bg-gradient-to-br from-gray-50 to-white text-center">
        <i data-lucide="construction" class="w-16 h-16 text-gray-400 mx-auto mb-4"></i>
        <p class="text-gray-500">功能开发中...</p>
      </div>
    </div>
  `
};

const DashboardView = {
  setup() {
    onMounted(() => lucide.createIcons());
    return {};
  },
  template: `
    <div class="max-w-7xl mx-auto space-y-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">控制台</h1>
          <p class="text-gray-600">任务创建 · 队列状态 · 报告概览</p>
        </div>
        <button class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors shadow-lg">
          <i data-lucide="plus" class="w-4 h-4 inline-block mr-2"></i>
          新建评估任务
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm hover:shadow-lg transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm text-gray-600">运行中任务</span>
            <i data-lucide="activity" class="w-5 h-5 text-indigo-600"></i>
          </div>
          <div class="text-3xl font-bold text-gray-900">2</div>
          <div class="text-xs text-gray-500 mt-2">SSE/WS 推送中</div>
        </div>

        <div class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm hover:shadow-lg transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm text-gray-600">近24h 完成</span>
            <i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i>
          </div>
          <div class="text-3xl font-bold text-gray-900">18</div>
          <div class="text-xs text-gray-500 mt-2">平均 6m/任务</div>
        </div>

        <div class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm hover:shadow-lg transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm text-gray-600">算力利用率</span>
            <i data-lucide="cpu" class="w-5 h-5 text-purple-600"></i>
          </div>
          <div class="text-3xl font-bold text-gray-900">62%</div>
          <div class="text-xs text-gray-500 mt-2">GPU: 1/2 Busy</div>
        </div>

        <div class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm hover:shadow-lg transition-all">
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm text-gray-600">异常告警</span>
            <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600"></i>
          </div>
          <div class="text-3xl font-bold text-gray-900">1</div>
          <div class="text-xs text-gray-500 mt-2">疑似梯度遮蔽</div>
        </div>
      </div>

      <div class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-gray-900">快速入口</h3>
          <span class="text-xs text-gray-500">建议：先跑基线，再跑多攻击对比</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <button class="p-4 rounded-lg border border-gray-200 hover:bg-gray-50 text-left">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-red-100 flex items-center justify-center">
                <i data-lucide="shield-alert" class="w-5 h-5 text-red-600"></i>
              </div>
              <div>
                <div class="font-semibold">鲁棒性评估</div>
                <div class="text-xs text-gray-500">创建攻击任务与报告</div>
              </div>
            </div>
          </button>
          <button class="p-4 rounded-lg border border-gray-200 hover:bg-gray-50 text-left">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-indigo-100 flex items-center justify-center">
                <i data-lucide="database" class="w-5 h-5 text-indigo-600"></i>
              </div>
              <div>
                <div class="font-semibold">数据集管理</div>
                <div class="text-xs text-gray-500">注册与预览样本</div>
              </div>
            </div>
          </button>
          <button class="p-4 rounded-lg border border-gray-200 hover:bg-gray-50 text-left">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-purple-100 flex items-center justify-center">
                <i data-lucide="flask-conical" class="w-5 h-5 text-purple-600"></i>
              </div>
              <div>
                <div class="font-semibold">算法库</div>
                <div class="text-xs text-gray-500">Schema 驱动参数表单</div>
              </div>
            </div>
          </button>
        </div>
      </div>
    </div>
  `
};

/* ---------------------------
   Robustness View (核心)
---------------------------- */
const RobustnessView = {
  setup() {

    function computeCostEstimate() {
      const n = selectedDataset.value?.stats?.samples || 1000;
      const sampleN = Math.min(n, 1000);
      let stepsNum = 1;
      let restarts = 1;

      const enabled = attackList.value.filter(a => a.enabled);
      if (enabled.length) {
        const p = enabled[0].params || {};
        stepsNum = Number(p.steps || 1);
        restarts = Number(p.restarts || 1);
        if (enabled[0].mode === "blackbox") {
          stepsNum = Number(p.queries || 1000) / 250;
        }
      }
      const est = Math.round(sampleN * stepsNum * restarts * 0.006);
      costEstimate.value = { samples: sampleN, steps: stepsNum, restarts, estSeconds: est };
      pushLog("INFO", `成本预估：samples=${sampleN}, steps~${stepsNum}, restarts=${restarts}, est≈${est}s`);
    }

    function extractDatasetName(fileName) {
      // 移除文件扩展名
      let name = fileName.replace(/\.[^/.]+$/, "");
      // 移除常见后缀
      name = name.replace(/(_dataset|_data|_train|_test|_val)$/i, "");
      // 将下划线和连字符替换为空格
      name = name.replace(/[_-]/g, " ");
      // 首字母大写
      name = name.replace(/\b\w/g, char => char.toUpperCase());
      
      datasetName.value = name || '未命名数据集';
      datasetDescription.value = `基于 ${name} 数据集构建的多模态鲁棒性评估模型`;
    };

    function startUploadSimulation() {
      uploading.value = true;
      uploadPaused.value = false;
      uploadProgress.value = 0;
      
      const interval = setInterval(() => {
        if (!uploadPaused.value && uploadProgress.value < 100) {
          uploadProgress.value += 2;
          uploadSpeed.value = (1.5 + Math.random()).toFixed(1);
          
          // 计算剩余时间
          const remainingPercent = 100 - uploadProgress.value;
          const totalSeconds = Math.round((remainingPercent / 2) * 50);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          remainingTime.value = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
          
          if (uploadProgress.value >= 100) {
            clearInterval(interval);
            uploading.value = false;
            pushLog("INFO", `数据集上传完成: ${uploadedFile.value.name}`);
          }
        }
      }, 200);
    };

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    };

    function simulateTraining() {
      if (trainingCompleted.value) return;
      
      const interval = setInterval(() => {
        if (trainingPaused.value) return;
        
        // 更新进度
        overallProgress.value = Math.min(overallProgress.value + 0.5, 100);
        currentEpoch.value = Math.floor((overallProgress.value / 100) * selectedEpochs.value);
        
        // 模拟损失下降和准确率上升
        if (lossValue.value > 0.1) {
          lossValue.value -= 0.01;
        }
        if (accuracy.value < 95) {
          accuracy.value += 0.25;
        }
        
        // 添加训练日志
        if (Math.random() > 0.7) {
          addTrainingLog(`Epoch ${currentEpoch.value}: Loss = ${lossValue.value.toFixed(4)}, Acc = ${accuracy.value.toFixed(2)}%`);
        }
        
        // 训练完成
        if (overallProgress.value >= 100) {
          clearInterval(interval);
          trainingCompleted.value = true;
          trainingStarted.value = false;
          addTrainingLog('模型训练完成!', 'success');
          addTrainingLog(`最终准确率: ${accuracy.value.toFixed(2)}%, 最终损失: ${lossValue.value.toFixed(4)}`, 'success');
          addTrainingLog(`模型已保存至: ${generatedModelFile.value.path}`, 'success');
        }
      }, 100);
    };

    function addTrainingLog(message, type = 'info') {

      trainingLogs.value.push({ time, message, type });
      
      // 保持日志数量不超过20条
      if (trainingLogs.value.length > 20) {

      if (strategyMode.value === "attack") {

      }

      switchTab("run");

      // 初始化结果为基线，随时间更新
      const baseClean = selectedModel.value?.cleanMetric ?? 0.85;
      
      // 根据策略模式生成不同的结果
      if (strategyMode.value === "attack") {
        summary.cleanAcc = baseClean;
        summary.robustAcc = baseClean;
        summary.asr = 0;
        summary.avgEps = (attackList.value.find(a => a.enabled)?.params?.epsilon ?? 0.031);
        summary.avgQueries = (threatModel.value === "blackbox") ? (attackList.value.find(a=>a.enabled)?.params?.queries ?? 5000) : 0;
        summary.totalSeconds = 0;
      } else {
        // 外部数据集测评模式
        summary.cleanAcc = baseClean * 0.95; // 假设外部数据集上准确率略低
        summary.robustAcc = baseClean * 0.65; // 假设外部数据集鲁棒性较差
        summary.asr = 1 - (summary.robustAcc / summary.cleanAcc);
        summary.avgEps = 0.0;
        summary.avgQueries = 0;
        summary.totalSeconds = 0;
      }

      if (runTimer) clearInterval(runTimer);

      runTimer = setInterval(() => {
        if (jobState.value !== "running") return;

        progress.value = Math.min(100, progress.value + Math.random() * 7 + 2);

        if (strategyMode.value === "attack") {
          // 对抗算法模式：robust acc 逐步下降，asr 上升
          const atkFactor = Math.min(0.55, 0.10 + (attackList.value.filter(a=>a.enabled).length-1)*0.06);
          const drop = atkFactor * (progress.value / 100);
          summary.robustAcc = Math.max(0, baseClean - drop);
          summary.asr = Math.max(0, 1 - summary.robustAcc / Math.max(1e-6, baseClean));
        } else {
          // 外部数据集模式：结果基于外部数据集
          const progressFactor = progress.value / 100;
          summary.robustAcc = baseClean * 0.65 + (baseClean * 0.15 * progressFactor);
          summary.asr = 1 - (summary.robustAcc / summary.cleanAcc);
        }

        summary.totalSeconds = Math.round((progress.value/100) * (costEstimate.value.estSeconds || 120));

        pushLog("INFO", `运行中... progress=${progress.value.toFixed(1)}%`);

        if (progress.value >= 100) {
          clearInterval(runTimer);
          runTimer = null;
          jobState.value = "done";
          progress.value = 100;
          pushLog("INFO", "任务完成：已生成结果摘要。");

          history.value.unshift({
            id: "JOB-2026-" + String(Math.floor(Math.random()*9000)+1000),
            dataset: strategyMode.value === "attack" ? selectedDataset.value.name : externalDataset.name,
            model: selectedModel.value.name,
            attacks: strategyMode.value === "attack" ? attackList.value.filter(a=>a.enabled).map(a=>a.name).join(", ") : "外部数据集测评",
            asr: Number(summary.asr.toFixed(3)),
            robustAcc: Number(summary.robustAcc.toFixed(3)),
            time: "刚刚",
            status: "完成"
          });
        }
      }, 650);
    }

    function pauseJob() {
      if (jobState.value !== "running") return;
      jobState.value = "paused";
      pushLog("WARN", "任务已暂停。");
    }
    function resumeJob() {
      if (jobState.value !== "paused") return;
      jobState.value = "running";
      pushLog("INFO", "任务已继续。");
    }
    function stopJob() {
      if (jobState.value === "idle") return;
      jobState.value = "failed";
      pushLog("ERROR", "任务已停止（演示：标记为 failed）。");
      if (runTimer) { clearInterval(runTimer); runTimer = null; }
    }

    // ---------- 本地文件读取：导入数据集 ----------
    const fileInputRef = ref(null);
    const importedFile = reactive({
      name: "",
      size: 0,
      type: "",
      textPreview: "",
      loaded: false
    });

    function triggerImportDataset() {
      fileInputRef.value?.click();
    }

    function onFileChange(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;

      importedFile.name = f.name;
      importedFile.size = f.size;
      importedFile.type = f.type || "unknown";
      importedFile.loaded = false;
      importedFile.textPreview = "";

      const reader = new FileReader();
      reader.onload = () => {
        const txt = typeof reader.result === "string" ? reader.result : "";
        importedFile.textPreview = txt.slice(0, 800);
        importedFile.loaded = true;
        pushLog("INFO", `已读取本地文件：${f.name}（${Math.round(f.size/1024)} KB）`);
      };
      reader.onerror = () => {
        pushLog("ERROR", `读取失败：${f.name}`);
      };

      // 兼容：文本/JSON/CSV等直接 readAsText；其它类型也以文本预览（演示）
      reader.readAsText(f);
      // 清空，便于重复选择同名文件也触发 change
      e.target.value = "";
    }

    // ---------- 鲁棒性评估结果计算 ----------
    const robustnessScore = computed(() => {
      // 鲁棒性评估公式：综合考虑多个因素
      const factors = [];
      
      if (summary.robustAcc > 0) {
        // 1. 鲁棒准确率权重最高 (40%)
        factors.push({ value: summary.robustAcc, weight: 0.4 });
      }
      
      if (summary.asr > 0) {
        // 2. 攻击成功率越低越好 (30%)
        factors.push({ value: 1 - summary.asr, weight: 0.3 });
      }
      
      if (summary.avgEps > 0) {
        // 3. 平均扰动越小越好 (20%)
        // 假设epsilon最大为0.3，归一化处理
        const epsScore = 1 - (summary.avgEps / 0.3);
        factors.push({ value: epsScore, weight: 0.2 });
      }
      
      if (summary.avgQueries > 0) {
        // 4. 平均查询次数越多，说明越难攻击 (10%)
        // 假设最大查询次数为10000，归一化处理
        const queryScore = Math.min(summary.avgQueries / 10000, 1);
        factors.push({ value: queryScore, weight: 0.1 });
      } else {
        // 如果没有查询次数数据，给默认值
        factors.push({ value: 0.5, weight: 0.1 });
      }
      
      // 计算加权平均
      const totalWeight = factors.reduce((sum, f) => sum + f.weight, 0);
      const weightedSum = factors.reduce((sum, f) => sum + (f.value * f.weight), 0);
      
      return totalWeight > 0 ? weightedSum / totalWeight : 0;
    });

    const robustnessLevel = computed(() => {
      const score = robustnessScore.value * 100;
      if (score >= 80) return { text: "优秀", color: "text-emerald-600", bg: "bg-emerald-100", border: "border-emerald-200" };
      if (score >= 60) return { text: "良好", color: "text-blue-600", bg: "bg-blue-100", border: "border-blue-200" };
      if (score >= 40) return { text: "中等", color: "text-amber-600", bg: "bg-amber-100", border: "border-amber-200" };
      return { text: "较差", color: "text-red-600", bg: "bg-red-100", border: "border-red-200" };
    });

    // 黄金数据集指标
    const goldenDatasetMetrics = computed(() => {
      return mockApi.getGoldenDataset(datasetId.value);
    });

    function exportConfig() {
      const payload = {
        modality: modality.value,
        datasetId: datasetId.value,
        modelId: modelId.value,
        strategyMode: strategyMode.value,
        threatModel: threatModel.value,
        targeted: isTargeted.value,
        attacks: attackList.value,
        metrics: selectedMetrics.value,
        outputs: outputOptions,
        importedFile: importedFile.loaded ? { name: importedFile.name, size: importedFile.size, type: importedFile.type } : null,
        externalDataset: externalDataset.loaded ? { name: externalDataset.name, size: externalDataset.size, stats: externalDataset.stats } : null
      };
      const json = JSON.stringify(payload, null, 2);
      navigator.clipboard?.writeText(json);
      pushLog("INFO", "已导出配置（并复制到剪贴板）。");
      alert("配置已复制到剪贴板（演示）。");
    }

    function exportReport() {
      pushLog("INFO", "导出报告：CSV/JSON（演示占位）。");
      alert("导出报告：演示占位。后续接后端文件下载。");
    }

    function fieldVisible(field) {
      if (!field.visible_if) return true;
      const { key, equals } = field.visible_if;
      return activeParams[key] === equals;
    }

    // Sample Modal
    function openSampleModal() { sampleModalOpen.value = true; nextTick(()=>lucide.createIcons()); }
    function closeSampleModal() { sampleModalOpen.value = false; }

    // 计算属性
    const canProceedToModel = computed(() => {
      // 检查是否已选择数据集（无论是预置数据集还是上传的数据集）
      return datasetId.value || (uploadedFile.value && datasetName.value.trim() !== '');
    });

    onMounted(async () => {
      const ms = mockApi.getModelsByDataset(datasetId.value);
      modelId.value = ms.length ? ms[0].id : "";
      await nextTick();
      lucide.createIcons();
      pushLog("INFO", "页面初始化完成。");
      // 确保初始在"数据集选择"
      activeTab.value = "ds";
    });

    watch(activeTab, async () => {
      await nextTick();
      lucide.createIcons();
    });

    watch(modality, () => {
      const ds = mockApi.getDatasets(modality.value)[0];
      datasetId.value = ds ? ds.id : "";
      modelId.value = "";
      selectedAttackId.value = "";
      attackList.value = [];
      externalDataset.loaded = false;
      pushLog("INFO", `已切换模态：${modality.value}`);
      switchTab("ds");
    });

    watch(datasetId, () => {
      const ms = mockApi.getModelsByDataset(datasetId.value);
      modelId.value = ms.length ? ms[0].id : "";
      attackList.value = [];
      selectedAttackId.value = "";
      externalDataset.loaded = false;
      pushLog("INFO", `已选择数据集：${selectedDataset.value?.name || datasetId.value}`);
    });

    watch(modelId, () => {
      if (!modelId.value) return;
      pushLog("INFO", `已选择模型：${selectedModel.value?.name || modelId.value}`);
    });

    watch(threatModel, () => {
      attackList.value = [];
      selectedAttackId.value = "";
      pushLog("INFO", `威胁模型：${threatModel.value}`);
    });

    watch(isTargeted, () => {
      if (Object.prototype.hasOwnProperty.call(activeParams, "targeted")) {
        activeParams.targeted = isTargeted.value;
      }
    });

    watch(selectedAttackId, () => {
      if (!selectedAttackId.value) return;
      loadAttackSchema(selectedAttackId.value);
    });

    // 销毁定时器（单文件 demo 也保留基本清理）
    window.addEventListener("beforeunload", () => {
      if (runTimer) clearInterval(runTimer);
    });

    return {
      // tabs
      tabs, activeTab, switchTab,
      
      // strategy
      strategyMode, selectStrategy,

      // selections
      modality, datasetId, modelId,
      datasets, selectedDataset, models, selectedModel,
      threatModel, isTargeted,

      // import local file
      fileInputRef, triggerImportDataset, onFileChange, importedFile,
      
      // external dataset
      externalDataset, externalDatasetFileInputRef, triggerImportExternalDataset, onExternalDatasetFileChange,

      // attacks & schema
      attacks, selectedAttackId,
      attackList, activeSchema, activeParams, activeEditIndex,
      onAddAttack, onEditAttack, onSaveAttackEdit, onRemoveAttack, onCloneAttack,
      fieldVisible,

      // metrics & outputs
      metricOptions, selectedMetrics, outputOptions,
      computeCostEstimate,

      // run control
      jobState, progress, logs, costEstimate,
      startJob, pauseJob, resumeJob, stopJob,
      exportConfig, exportReport,

      // results
      summary, robustnessScore, robustnessLevel, goldenDatasetMetrics,
      openSampleModal,
      history,

      // modal
      sampleModalOpen, sampleDetail, closeSampleModal,

      // 数据集上传相关
      dragover, fileInput, uploadedFile, uploading, uploadPaused, uploadProgress, uploadSpeed, remainingTime,
      datasetName, selectedModality, selectedTask, datasetDescription, dataModalities, taskTypes,
      
      // 模型训练相关
      selectedTrainModel, selectedTrainModelName,
      selectedLayers, selectedHiddenUnits, selectedLearningRate, selectedBatchSize, selectedOptimizer, selectedEpochs,
      trainingStarted, trainingPaused, trainingCompleted, overallProgress, currentEpoch, lossValue, accuracy, trainingLogs,
      generatedModelFile,
      layers, hiddenUnits, learningRates, batchSizes, optimizers, epochs, recommendedModels,
      
      // 函数
      triggerFileUpload, handleFileSelect, handleDrop, toggleUpload, cancelUpload,
      formatFileSize, selectTrainModel,
      startTraining, restartTraining, toggleTraining, downloadModel, viewModelDetails,
      canProceedToModel,

      Math
    };
  },

              </div>

                      <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">适用场景</th>
                      <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900">简介</th>

                    </tr>
                  </thead>

                                : 'border-gray-300'

                            <i 
                              v-if="selectedTrainModel === model.id"

                      <td class="px-6 py-4">

                            <div class="font-medium text-gray-900">{{ model.name }}</div>
                            <div class="text-xs text-gray-500">{{ model.abbr }}</div>
                          </div>
                        </div>
                      </td>
                      <td class="px-6 py-4">

                          <span class="px-3 py-1 text-xs font-medium rounded-full" :class="model.typeClass">

                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

                            {{ layer }}层
                          </label>
                        </div>
                      </div>
                      
                      <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">隐藏单元</label>
                        <div class="grid grid-cols-3 gap-2">

                            v-for="unit in hiddenUnits" 
                            :key="unit"
                            :class="[
                              'p-3 border rounded-lg cursor-pointer text-center transition-all',
                              selectedHiddenUnits === unit 
                                ? 'border-purple-500 bg-purple-50 text-purple-700 font-medium' 
                                : 'border-gray-300 hover:border-gray-400'
                            ]"
                            @click="selectedHiddenUnits = unit"
                          >
                            {{ unit }}
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 训练参数 -->
                <div class="space-y-6">
                  <div>
                    <h5 class="font-medium text-gray-900 mb-3">训练参数</h5>
                    <div class="space-y-4">
                      <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">学习率</label>
                        <div class="grid grid-cols-3 gap-2">
                          <label 
                            v-for="lr in learningRates" 
                            :key="lr"
                            :class="[
                              'p-3 border rounded-lg cursor-pointer text-center transition-all',
                              selectedLearningRate === lr 
                                ? 'border-green-500 bg-green-50 text-green-700 font-medium' 
                                : 'border-gray-300 hover:border-gray-400'
                            ]"
                            @click="selectedLearningRate = lr"
                          >
                            {{ lr }}
                          </label>
                        </div>
                      </div>
                      
                      <div class="grid grid-cols-2 gap-4">
                        <div>
                          <label class="block text-sm font-medium text-gray-700 mb-2">批次大小</label>

                            <label 
                              v-for="batch in batchSizes" 
                              :key="batch"
                              :class="[
                                'flex-1 p-3 border rounded-lg cursor-pointer text-center transition-all text-sm',

                                  ? 'border-blue-500 bg-blue-50 text-blue-700 font-medium' 
                                  : 'border-gray-300 hover:border-gray-400'
                              ]"
                              @click="selectedBatchSize = batch"
                            >
                              {{ batch }}
                            </label>
                          </div>
                        </div>
                        
                        <div>
                          <label class="block text-sm font-medium text-gray-700 mb-2">优化器</label>

                              :key="optimizer"

                                  ? 'border-orange-500 bg-orange-50 text-orange-700 font-medium' 
                                  : 'border-gray-300 hover:border-gray-400'
                              ]"
                              @click="selectedOptimizer = optimizer"
                            >
                              {{ optimizer }}
                            </label>
                          </div>
                        </div>
                      </div>
                      
                      <div>

                                ? 'border-red-500 bg-red-50 text-red-700 font-medium' 
                                : 'border-gray-300 hover:border-gray-400'
                            ]"
                            @click="selectedEpochs = epoch"
                          >
                            {{ epoch }}
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

                  <i data-lucide="play" class="w-4 h-4 inline-block mr-2"></i>
                  开始训练
                </button>

                    <span class="font-bold text-indigo-600">{{ overallProgress }}%</span>
                  </div>
                  <div class="h-3 bg-gray-200 rounded-full overflow-hidden">
                    <div 
                      class="h-full progress-bar rounded-full transition-all duration-1000"

                  </div>

                    </div>
                  </div>

                  </div>

                      <i data-lucide="trending-up" class="w-4 h-4 mr-1"></i>

                  </div>

                      </span>
                    </div>
                  </div>
                </div>

                          <div class="flex gap-2">
                            <button 
                              @click="downloadModel"
                              class="px-3 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition-colors"

                              <i data-lucide="download" class="w-3 h-3 inline-block mr-1"></i>
                              下载
                            </button>
                            <button 
                              @click="viewModelDetails"
                              class="px-3 py-1 border border-green-300 text-green-700 text-xs rounded hover:bg-green-50 transition-colors"
                            >
                              <i data-lucide="eye" class="w-3 h-3 inline-block mr-1"></i>
                              查看
                            </button>
                          </div>
                        </div>
                        <div class="space-y-2">
                          <div class="flex items-center gap-3 p-2 bg-gray-50 rounded">
                            <i data-lucide="file" class="w-4 h-4 text-green-600"></i>

                            </div>
                            <span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full">
                              已保存
                            </span>
                          </div>
                          <div class="text-xs text-gray-600 pl-7">

                          </div>

                        </div>
                        <div class="p-3 bg-white border border-gray-200 rounded-lg">
                          <div class="text-xs text-gray-600 mb-1">最终损失值</div>
                          <div class="text-xl font-bold text-blue-600">{{ lossValue.toFixed(4) }}</div>
                        </div>
                      </div>
                    </div>
                  </div>

                    <span class="text-xs text-gray-500">{{ trainingLogs.length }} 条记录</span>
                  </div>

                      <span class="text-gray-500">[{{ log.time }}]</span>
                      <span :class="log.type === 'info' ? 'text-gray-700' : 'text-green-600'">
                        {{ log.message }}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

                  </div>
                  <div class="flex items-center gap-2">

                    <span>参数可配置</span>
                  </div>
                </div>

                    <h4 class="font-bold text-gray-900">外部数据集测评</h4>

                </div>
                <div class="space-y-2 text-sm text-gray-700">
                  <div class="flex items-center gap-2">
                    <i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>
                    <span>支持自定义数据集</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>
                    <span>批量评估效率高</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>
                    <span>与黄金数据集对比</span>
                  </div>
                </div>
                <div class="mt-4">
                  <span :class="[
                    'text-xs px-3 py-1 rounded-full',

                  ]">
                    {{ strategyMode === 'externalDataset' ? '当前选择' : '点击选择' }}
                  </span>
                </div>
              </div>
            </div>

            <!-- 策略详情区域 -->
            <div v-if="strategyMode === 'attack'" class="p-6 border border-gray-200 rounded-xl bg-gray-50">

                <p class="text-sm text-gray-600">选择威胁模型和攻击方法</p>
              </div>
              
              <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="text-xs font-semibold text-gray-600">威胁模型</label>
                    <select v-model="threatModel" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
                      <option value="whitebox">白盒（White-box）</option>
                      <option value="blackbox">黑盒（Black-box）</option>
                    </select>
                  </div>

                  <div class="flex items-end">
                    <div class="w-full p-3 bg-white border border-gray-200 rounded-lg">
                      <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-gray-600">目标攻击</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                          <input v-model="isTargeted" type="checkbox" class="sr-only peer">
                          <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:border-gray-300 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>

                      </div>
                      <div class="text-[11px] text-gray-500 mt-2">（分类任务常用非定向；此处演示开关）</div>

                  </div>
                </div>

                <div>

                    </option>
                  </select>

                  <button @click="onAddAttack" class="px-3 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">

                  </button>
                  <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    加载默认参数
                  </button>
                  <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    保存为预设
                  </button>
                </div>

                <div class="border border-gray-200 rounded-lg overflow-hidden">
                  <div class="px-4 py-2 bg-gray-100 border-b border-gray-200 text-xs font-semibold text-gray-600 flex justify-between">
                    <span>攻击列表（可多攻击对比）</span>
                    <span class="text-gray-500">启用/编辑/复制/删除</span>
                  </div>

                  <div v-if="attackList.length===0" class="p-4 text-sm text-gray-500">

                  </div>

                  <div v-else class="divide-y divide-gray-100">
                    <div v-for="(it, idx) in attackList" :key="idx" class="p-4 hover:bg-gray-50">
                      <div class="flex items-start justify-between gap-3">
                        <div class="flex-1">
                          <div class="flex items-center gap-2">
                            <span class="font-semibold text-gray-900">{{ it.name }}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full border border-gray-200 bg-white text-gray-600">
                              {{ it.mode }}
                            </span>
                            <span v-if="it.params && it.params.epsilon!=null" class="text-[10px] px-2 py-0.5 rounded-full border border-indigo-200 bg-indigo-50 text-indigo-700">
                              ε={{ Number(it.params.epsilon).toFixed(3) }}
                            </span>
                          </div>
                          <div class="text-xs text-gray-500 mt-1">
                            参数摘要：{{ Object.keys(it.params||{}).slice(0,4).map(k=>k+'='+it.params[k]).join(' · ') }}<span v-if="Object.keys(it.params||{}).length>4"> ...</span>
                          </div>
                        </div>

                        <div class="flex items-center gap-2">
                          <label class="inline-flex items-center gap-2 text-xs text-gray-600">
                            <input type="checkbox" v-model="it.enabled" class="rounded border-gray-300">

                          </label>
                          <button @click="onEditAttack(idx)" class="px-2 py-1.5 text-xs bg-white border border-gray-300 rounded-lg hover:bg-gray-50">编辑</button>
                          <button @click="onCloneAttack(idx)" class="px-2 py-1.5 text-xs bg-white border border-gray-300 rounded-lg hover:bg-gray-50">复制</button>
                          <button @click="onRemoveAttack(idx)" class="px-2 py-1.5 text-xs bg-white border border-red-200 text-red-600 rounded-lg hover:bg-red-50">删除</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div v-else-if="strategyMode === 'externalDataset'" class="p-6 border border-gray-200 rounded-xl bg-emerald-50">
              <div class="mb-4">
                <h4 class="font-bold text-gray-900 mb-2">外部数据集测评配置</h4>
                <p class="text-sm text-gray-600">导入外部对抗数据集进行模型评估</p>
              </div>
              
              <div class="space-y-4">
                <div class="p-4 bg-white border border-gray-200 rounded-lg">
                  <div class="flex items-center justify-between mb-3">
                    <div class="text-sm font-semibold text-gray-900">外部数据集导入</div>
                    <button @click="triggerImportExternalDataset" class="px-3 py-1.5 text-xs bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">
                      导入数据集
                    </button>
                  </div>
                  
                  <div v-if="!externalDataset.loaded" class="text-center py-6 border border-dashed border-gray-300 rounded-lg">
                    <i data-lucide="upload" class="w-10 h-10 text-gray-400 mx-auto mb-3"></i>
                    <p class="text-sm text-gray-600 mb-2">尚未导入外部数据集</p>
                    <p class="text-xs text-gray-500">支持格式：CSV, JSON, NPZ, 图像/文本/音频文件</p>
                    <button @click="triggerImportExternalDataset" class="mt-3 px-4 py-2 text-sm bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">
                      点击导入
                    </button>
                    
                    <!-- 隐藏 file input -->
                    <input ref="externalDatasetFileInputRef" type="file" class="hidden" @change="onExternalDatasetFileChange" />
                  </div>
                  
                  <div v-else class="space-y-3">
                    <div class="flex items-center justify-between">
                      <div>
                        <div class="font-medium text-gray-900">{{ externalDataset.name }}</div>
                        <div class="text-xs text-gray-600 mt-1">{{ Math.round(externalDataset.size/1024) }} KB · {{ externalDataset.type }}</div>
                      </div>
                      <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">
                        已加载
                      </span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-3 text-sm">
                      <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="text-xs text-gray-500">样本数</div>
                        <div class="font-bold text-gray-900 mt-1">{{ externalDataset.stats.samples }}</div>
                      </div>
                      <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="text-xs text-gray-500">类别数</div>
                        <div class="font-bold text-gray-900 mt-1">{{ externalDataset.stats.classes }}</div>
                      </div>
                      <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="text-xs text-gray-500">输入格式</div>
                        <div class="font-bold text-gray-900 mt-1">{{ externalDataset.stats.input }}</div>
                      </div>
                    </div>
                    
                    <div class="flex gap-2">
                      <button class="px-3 py-1.5 text-xs bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                        数据集预览
                      </button>
                      <button class="px-3 py-1.5 text-xs bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                        统计信息
                      </button>
                      <button @click="triggerImportExternalDataset" class="px-3 py-1.5 text-xs bg-white border border-emerald-200 text-emerald-600 rounded-lg hover:bg-emerald-50">
                        重新导入
                      </button>
                    </div>
                  </div>
                </div>
                
                <div class="p-4 bg-white border border-gray-200 rounded-lg">
                  <div class="text-sm font-semibold text-gray-900 mb-3">评估说明</div>
                  <div class="text-sm text-gray-700 space-y-2">
                    <p>外部数据集测评将使用您导入的数据集对选定模型进行批量评估。</p>
                    <p>系统将计算模型在外部数据集上的准确率、鲁棒准确率等指标，并与黄金数据集进行对比分析。</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="flex justify-between">
              <button @click="switchTab('model')" class="px-4 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                上一步
              </button>
              <button @click="switchTab('params')" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                下一步：参数配置
              </button>
            </div>
          </div>
        </div>

        <!-- 4 参数配置（根据策略模式动态调整） -->
        <div v-else-if="activeTab==='params'" key="params" class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white text-sm font-bold flex items-center justify-center shadow">4</span>
              <div>
                <h3 class="font-bold text-gray-900">参数配置</h3>
                <p class="text-xs text-gray-500 mt-1" v-if="strategyMode==='attack'">Schema 驱动动态表单（字段/默认值/校验/依赖显示）</p>
                <p class="text-xs text-gray-500 mt-1" v-else>外部数据集评估参数配置</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-500">
              <i data-lucide="sliders" class="w-4 h-4"></i>
              <span v-if="strategyMode==='attack'">Attack Config</span>
              <span v-else>External Dataset Config</span>
            </div>
          </div>

          <div class="space-y-4">
            <!-- 对抗算法模式参数配置 -->
            <div v-if="strategyMode==='attack'">
              <div v-if="!selectedAttackId" class="p-4 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-500">
                请先在"鲁棒性评估策略选择"中选择一个攻击方法，以加载对应参数表单。
              </div>

              <div v-else class="space-y-4">
                <div class="p-4 bg-indigo-50 border border-indigo-200 rounded-lg">
                  <div class="flex items-center justify-between">
                    <div class="font-semibold text-indigo-900">{{ activeSchema.title }}</div>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-white border border-indigo-200 text-indigo-700">
                      {{ activeEditIndex>=0 ? "编辑模式" : "预览/新增" }}
                    </span>
                  </div>
                  <div class="text-xs text-indigo-700 mt-1">提示：此处表单仅展示。添加攻击时会采用默认值；编辑时可保存回列表。</div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <template v-for="f in activeSchema.fields" :key="f.key">
                    <div v-if="fieldVisible(f)" class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                      <div class="flex items-center justify-between mb-2">
                        <label class="text-sm font-medium text-gray-700">{{ f.label }}</label>
                        <span v-if="f.unit" class="text-[11px] text-gray-500">{{ f.unit }}</span>
                      </div>

                      <template v-if="f.type==='number'">
                        <div class="flex items-center gap-3">
                          <input type="number" :min="f.min" :max="f.max" :step="f.step"
                            v-model.number="activeParams[f.key]"
                            class="w-28 border border-gray-300 rounded-lg px-2 py-1.5 text-sm bg-white"/>
                          <input type="range" :min="f.min" :max="f.max" :step="f.step"
                            v-model.number="activeParams[f.key]"
                            class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"/>
                        </div>
                        <div v-if="f.help" class="text-[11px] text-gray-500 mt-2">{{ f.help }}</div>
                      </template>

                      <template v-else-if="f.type==='enum'">
                        <select v-model="activeParams[f.key]" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
                          <option v-for="op in f.options" :key="op" :value="op">{{ op }}</option>
                        </select>
                        <div v-if="f.help" class="text-[11px] text-gray-500 mt-2">{{ f.help }}</div>
                      </template>

                      <template v-else-if="f.type==='boolean'">
                        <label class="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" v-model="activeParams[f.key]" class="sr-only peer">
                          <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:border-gray-300 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                          <span class="ml-3 text-sm text-gray-600">{{ activeParams[f.key] ? "开启" : "关闭" }}</span>
                        </label>
                        <div v-if="f.help" class="text-[11px] text-gray-500 mt-2">{{ f.help }}</div>
                      </template>

                      <template v-else>
                        <input v-model="activeParams[f.key]" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white"/>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="flex flex-wrap gap-2">
                  <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    参数校验
                  </button>
                  <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    重置默认
                  </button>
                  <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    导入/导出 JSON
                  </button>

                  <button v-if="activeEditIndex>=0" @click="onSaveAttackEdit"
                    class="ml-auto px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    保存到攻击列表
                  </button>
                </div>
              </div>
            </div>

            <!-- 外部数据集模式参数配置 -->
            <div v-else>
              <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
                <div class="flex items-center justify-between">
                  <div class="font-semibold text-emerald-900">外部数据集评估参数</div>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-white border border-emerald-200 text-emerald-700">
                    外部数据集模式
                  </span>
                </div>
                <div class="text-xs text-emerald-700 mt-1">配置外部数据集的评估参数</div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                  <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-gray-700">批次大小</label>
                    <span class="text-[11px] text-gray-500">Batch Size</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <input type="number" min="1" max="512" step="1" value="32"
                      class="w-28 border border-gray-300 rounded-lg px-2 py-1.5 text-sm bg-white"/>
                    <input type="range" min="1" max="512" step="1" value="32"
                      class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"/>
                  </div>
                  <div class="text-[11px] text-gray-500 mt-2">较大的批次大小可提高评估效率</div>
                </div>

                <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                  <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-gray-700">评估样本数</label>
                    <span class="text-[11px] text-gray-500">Samples</span>
                  </div>
                  <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
                    <option value="all">全部样本 ({{ externalDataset.stats.samples || 0 }})</option>
                    <option value="1000">1000个样本</option>
                    <option value="500">500个样本</option>
                    <option value="100">100个样本</option>
                  </select>
                  <div class="text-[11px] text-gray-500 mt-2">选择用于评估的样本数量</div>
                </div>

                <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                  <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-gray-700">置信度阈值</label>
                    <span class="text-[11px] text-gray-500">Confidence Threshold</span>
                  </div>
                  <div class="flex items-center gap-3">
                    <input type="number" min="0.0" max="1.0" step="0.01" value="0.5"
                      class="w-28 border border-gray-300 rounded-lg px-2 py-1.5 text-sm bg-white"/>
                    <input type="range" min="0.0" max="1.0" step="0.01" value="0.5"
                      class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"/>
                  </div>
                  <div class="text-[11px] text-gray-500 mt-2">预测置信度低于此值视为不确定</div>
                </div>

                <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                  <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-gray-700">数据预处理</label>

                        </td>
                        <td class="px-4 py-3">
                          <div class="font-mono font-bold text-amber-700">{{ (goldenDatasetMetrics.cleanAcc*100).toFixed(1) }}%</div>
                          <div class="text-xs text-amber-600">基准</div>
                        </td>
                        <td class="px-4 py-3">
                          <div class="font-mono font-bold text-amber-700">{{ (goldenDatasetMetrics.robustAcc*100).toFixed(1) }}%</div>
                          <div class="text-xs text-amber-600">基准</div>
                        </td>
                        <td class="px-4 py-3">
                          <div class="font-mono font-bold text-amber-700">{{ (goldenDatasetMetrics.asr*100).toFixed(1) }}%</div>
                          <div class="text-xs text-amber-600">基准</div>
                        </td>
                        <td class="px-4 py-3">
                          <div class="font-mono font-bold text-amber-700">ε={{ Number(goldenDatasetMetrics.avgEps).toFixed(3) }}</div>
                        </td>
                        <td class="px-4 py-3">
                          <div class="font-mono font-bold text-amber-700">{{ goldenDatasetMetrics.totalSeconds }}s</div>
                        </td>
                        <td class="px-4 py-3">
                          <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 border border-amber-200">
                            黄金标准
                          </span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                
                <div v-else class="p-4 text-center text-gray-500">
                  暂无对应黄金数据集信息
                </div>
                
                <div class="mt-4 p-3 bg-gray-50 border border-gray-200 rounded-lg">
                  <div class="text-xs font-semibold text-gray-700 mb-2">对比分析</div>
                  <div class="text-sm text-gray-600">
                    <p v-if="summary.robustAcc >= (goldenDatasetMetrics?.robustAcc || 0)" class="text-emerald-600">
                      ✓ 当前模型鲁棒性优于黄金数据集标准
                    </p>
                    <p v-else class="text-red-600">
                      ✗ 当前模型鲁棒性低于黄金数据集标准
                    </p>
                    <p class="text-gray-500 text-xs mt-2">
                      黄金数据集提供了相同模态和任务类型下的基准性能指标，用于横向对比评估结果。
                    </p>
                </div>
              </div>
            </div>

              <div class="p-6 border border-gray-200 rounded-xl bg-white shadow-sm">
                <div class="flex items-center justify-between mb-6">
                  <h3 class="font-bold text-gray-900">评估历史</h3>
                  <button @click="exportReport" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">导出报告</button>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead class="text-xs text-gray-500 uppercase bg-gray-50 border-b border-gray-200">
                      <tr>
                        <th class="px-4 py-3 text-left">任务ID</th>
                        <th class="px-4 py-3 text-left">数据集</th>
                        <th class="px-4 py-3 text-left">模型</th>
                        <th class="px-4 py-3 text-left">评估策略</th>
                        <th class="px-4 py-3 text-left">ASR</th>
                        <th class="px-4 py-3 text-left">Robust Acc</th>
                        <th class="px-4 py-3 text-left">时间</th>
                        <th class="px-4 py-3 text-right">操作</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                      <tr v-for="h in history" :key="h.id" class="hover:bg-gray-50">
                        <td class="px-4 py-3 font-mono text-xs text-gray-600">{{ h.id }}</td>
                        <td class="px-4 py-3">{{ h.dataset }}</td>
                        <td class="px-4 py-3">{{ h.model }}</td>
                        <td class="px-4 py-3 text-gray-700">{{ h.attacks }}</td>
                        <td class="px-4 py-3 font-bold text-red-600">{{ (h.asr*100).toFixed(1) }}%</td>
                        <td class="px-4 py-3 font-bold text-emerald-700">{{ (h.robustAcc*100).toFixed(1) }}%</td>
                        <td class="px-4 py-3 text-gray-500">{{ h.time }}</td>
                        <td class="px-4 py-3 text-right">
                          <button class="text-indigo-600 hover:text-indigo-700 font-medium">详情</button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Sample Modal -->
          <transition name="fade">
            <div v-if="sampleModalOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
              <transition name="slide">
                <div class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
                  <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                    <div class="font-bold text-gray-900">样本级查看器（Demo）</div>
                    <button @click="closeSampleModal" class="p-2 rounded-lg hover:bg-gray-50">
                      <i data-lucide="x" class="w-5 h-5 text-gray-600"></i>
                    </button>
                  </div>

                  <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-3">
                      <div class="text-sm font-semibold text-gray-900">原始输入</div>
                      <div class="h-44 rounded-xl bg-gradient-to-br from-gray-100 to-white border border-gray-200 flex items-center justify-center text-gray-500 text-sm">
                        原图/原文本/原音频（占位）
                      </div>
                      <div class="text-xs text-gray-500">预测：{{ sampleDetail.origPred }} · 置信度 {{ (sampleDetail.confBefore*100).toFixed(1) }}%</div>
                    </div>

                    <div class="space-y-3">
                      <div class="text-sm font-semibold text-gray-900">对抗输入</div>
                      <div class="h-44 rounded-xl bg-gradient-to-br from-red-50 to-white border border-red-200 flex items-center justify-center text-red-600 text-sm">
                        对抗样本（占位）
                      </div>
                      <div class="text-xs text-gray-500">预测：{{ sampleDetail.advPred }} · 置信度 {{ (sampleDetail.confAfter*100).toFixed(1) }}%</div>
                    </div>

                    <div class="md:col-span-2 p-4 bg-gray-50 border border-gray-200 rounded-xl">
                      <div class="text-sm font-semibold text-gray-900 mb-2">差分与过程信息</div>
                      <div class="text-sm text-gray-700">{{ sampleDetail.note }}</div>
                      <div class="mt-3 flex gap-2">
                        <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">保存该样本</button>
                        <button class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">复制样本ID</button>
                        <button class="ml-auto px-3 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">加入失败集</button>
                      </div>
                    </div>
                  </div>

                  <div class="px-6 py-4 border-t border-gray-200 bg-white flex justify-end gap-2">
                    <button @click="closeSampleModal" class="px-4 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">关闭</button>
                  </div>
                </div>
              </transition>
            </div>
          </transition>

          <div class="flex justify-start">
            <button @click="switchTab('run')" class="px-4 py-2 text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
              返回：运行控制
            </button>
          </div>
        </div>
      </transition>
    </div>
  `
};

/* ---------------------------
   App
---------------------------- */
const app = createApp({
  components: {
    "sidebar-item": SidebarItem,
    "dashboard-view": DashboardView,
    "robustness-view": RobustnessView,
    "placeholder-view": PlaceholderView
  },
  setup() {
    const currentView = ref("robustness");
    const viewTitles = {
      dashboard: "控制台",
      robustness: "鲁棒性评估平台",
      datasets: "数据集管理",
      models: "模型管理",
      attacks: "算法库",
      resources: "算力资源",
      settings: "系统设置"
    };
    const viewTitle = computed(() => viewTitles[currentView.value] || "控制台");

    const changeView = (view) => { currentView.value = view; };

    onMounted(() => lucide.createIcons());
    watch(currentView, async () => {
      await nextTick();
      lucide.createIcons();
    });

    return { currentView, viewTitle, changeView };
  }
});

app.mount("#app");
</script>
</body>
</html>
